<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiRace — Semantic Map (Sketched)</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Plotly.js with backup CDN -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="visualize-page">
  <div style="position: fixed; top: 1rem; right: 1rem; z-index: 1000;">
    <button id="theme-toggle" class="sketch-btn" style="font-size: 0.9rem; padding: 5px 12px;">Toggle Ink</button>
  </div>
  
  <main class="visualize-main">
    <header class="home-header">
      <h1 class="logo-sketch" style="font-size: 3rem;">Semantic Map</h1>
      <p class="tagline-sketch">A hand-drawn map of human knowledge.</p>
      <nav style="margin-top: 1rem; display: flex; gap: 1.5rem; justify-content: center;">
        <a href="/" class="hand-written">← Back to Menu</a>
      </nav>
    </header>

    <div class="sketch-box flex-center flex-gap-sm margin-bottom-sm" style="border-style: dashed;">
      <button id="btn-2d" class="sketch-btn active" style="font-size: 1rem;">2D SKETCH</button>
      <button id="btn-3d" class="sketch-btn" style="font-size: 1rem;">3D SPACE</button>
    </div>

    <div class="sketch-box" style="height: 500px; padding: 10px;">
      <div id="plot-area" style="width: 100%; height: 100%;"></div>
      <div id="plot-loader" class="flex-center" style="position: absolute; inset: 0; background: var(--bg); z-index: 10; flex-direction: column;">
        <div class="hand-written" style="font-size: 1.5rem; color: var(--ink-blue);">DROWNING POINTS...</div>
      </div>
    </div>

    <footer style="margin-top: 20px; text-align: center; font-family: var(--font-body); opacity: 0.7;">
      <p>Articles are clustered by semantic similarity. Similar ideas stay close on the paper.</p>
    </footer>
  </main>

  <style>
    .sketch-btn.active {
      background: var(--ink-blue);
      color: #fff;
    }
  </style>

  <script>
    window.WIKIRACE_API = {
      embeddings: "{{ url_for('api_embeddings') }}"
    };
  </script>
  <script src="/static/js/visualizer.js"></script>
  <script>
    // ── Theme Toggle ──────────────────────────────────────────────────────────
    const themeToggle = document.getElementById("theme-toggle");
    const currentTheme = localStorage.getItem("wikirace.theme") || "light";
    document.documentElement.setAttribute("data-theme", currentTheme);
    
    themeToggle.addEventListener("click", () => {
      const newTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
      localStorage.setItem("wikirace.theme", newTheme);
    });
  </script>
</body>
</html>
